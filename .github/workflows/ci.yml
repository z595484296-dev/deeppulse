name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Python
        run: python -m py_compile server.py emotion.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript
        run: find web -type f -name '*.js' -print0 | xargs -0 -n1 node --check

